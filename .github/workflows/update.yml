name: Update README dengan Project Terbaru

on:
  schedule:
    - cron: '0 0 * * *' # Jalan otomatis setiap hari jam 12 malam UTC
  workflow_dispatch: # Biar bisa jalanin manual dari tombol "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # WAJIB ADA: Biar bot diizinkan nge-push perubahan ke repo lu
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Run Script
        run: python update_readme.py

      - name: Commit & Push ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update latest projects" || exit 0
          git push